# Fuzzing: once a week, each file parser gets a time-boxed run of random input
# from libFuzzer, built with AddressSanitizer. A crash, a hang or a memory
# error fails that target's job and uploads the input that caused it. The
# corpus each target grows is saved for the next run and, all targets
# together, for ci.yml's fuzz-replay job. See "Fuzzing the file parsers" in
# docs/development.md.

name: Fuzz

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The seed folders, written once and shared by every target. hydra_tests
  # writes them (tools/fuzz_seeds.ps1), one folder per target in kTargets
  # (tests/fuzz/harness.h), and the fuzz job below takes its matrix from those
  # folder names, so the target list lives in kTargets alone.
  seeds:
    name: Fuzz seeds
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build hydra_tests
        run: .\build_cpp.ps1 -Target hydra_tests

      - name: Write the seed folders
        run: .\tools\fuzz_seeds.ps1 -OutDir seeds -TestsExe build-cpp\Release\hydra_tests.exe

      - name: List the targets
        id: targets
        run: |
          $names = @(Get-ChildItem seeds -Directory | ForEach-Object Name)
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('targets=' + (ConvertTo-Json -Compress -InputObject $names))

      - name: Keep the seeds for the fuzz jobs
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-seeds
          path: seeds
          retention-days: 1

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: seeds
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One exe per target (kTargets, tests/fuzz/harness.h), named by the
        # seeds job from the seed folders.
        target: ${{ fromJson(needs.seeds.outputs.targets) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Puts the compiler's folder on PATH. The ASan runtime DLL the fuzz exes
      # load lives there, as in ci.yml's asan job.
      - name: Set up the Visual Studio developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build fuzz_${{ matrix.target }}
        run: .\build_cpp.ps1 -Preset fuzz -Target fuzz_${{ matrix.target }}

      - name: Fetch the seeds
        uses: actions/download-artifact@v4
        with:
          name: fuzz-seeds
          path: seeds

      # The corpus the fuzzer grew on earlier runs. Each run saves under a key
      # of its own and restores the newest one, so coverage builds up week by
      # week.
      - name: Restore the grown corpus
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # tools/fuzz_run.ps1 holds the per-input limits, which ci.yml's replay
      # job shares. A crash, a hang or a memory blowup fails the job.
      - name: Fuzz ${{ matrix.target }}
        run: .\tools\fuzz_run.ps1 -Mode fuzz -Target ${{ matrix.target }} -Corpus corpus -Seeds seeds\${{ matrix.target }} -Seconds 600 -CrashDir crashes

      - name: Save the grown corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # For the corpus-all job below, which bundles every target's corpus.
      - name: Hand the grown corpus to corpus-all
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: corpus
          retention-days: 1
          if-no-files-found: ignore

      # The input that broke the parser. Copy it into testdata/fuzz/<target>/
      # with the fix (testdata/fuzz/README.md).
      - name: Upload the crash files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crashes
          if-no-files-found: ignore

  # Every target's grown corpus in one cache, one folder per target, which
  # ci.yml's fuzz-replay job restores on each push and pull request. One cache
  # lets that job restore by one fixed key prefix, so it never needs the
  # target list. The per-target caches above stay, for the next fuzz run.
  # It runs when a fuzz job failed too, as the per-target saves do.
  corpus-all:
    name: Gather the grown corpora
    needs: [seeds, fuzz]
    if: always() && needs.seeds.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # A run where no fuzz job uploaded anything has nothing to fetch; the
      # step after this one then saves nothing.
      - name: Fetch every target's corpus
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fuzz-corpus-*
          path: gathered

      # The download puts each artifact in a folder named after it; the replay
      # wants each folder named after its target.
      - name: Name each folder after its target
        id: gather
        run: |
          New-Item -ItemType Directory -Force corpus-all | Out-Null
          if (Test-Path gathered) {
            Get-ChildItem gathered -Directory | ForEach-Object {
              Move-Item $_.FullName (Join-Path corpus-all ($_.Name -replace '^fuzz-corpus-', ''))
            }
          }
          $folders = @(Get-ChildItem corpus-all -Directory)
          $folders | ForEach-Object {
            "{0,-6} {1,5} inputs" -f $_.Name, @(Get-ChildItem $_.FullName -File).Count
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "folders=$($folders.Count)"

      # An empty save would become the newest combined cache and hide the
      # last good one from the replay job.
      - name: Save the combined corpus
        if: steps.gather.outputs.folders != '0'
        uses: actions/cache/save@v4
        with:
          path: corpus-all
          key: fuzz-corpus-all-${{ github.run_id }}
