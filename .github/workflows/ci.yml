# Continuous integration: build Hydra and run its tests on every push to main
# and every pull request into main, and the slow AddressSanitizer job once a
# night. The local hooks are the first gate; this is the backstop for a commit
# made outside them. See "Continuous integration" in docs/development.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run it replaces.
# The event is in the group, so a push never cancels the nightly run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Which ctest entries a hosted runner runs. The excluded entry opens the
# default sound output, and hosted runners have no audio device (tests/shards.txt
# owns the entry). -R keeps hydra_uitest out of the ctest steps: the steps after
# them run it on its own.
env:
  HOSTED_CTEST_FILTER: -R hydra_tests -E audio_device

jobs:
  build-and-test:
    name: Build and test (Windows, Release)
    if: github.event_name != 'schedule'
    # The default CMake preset uses the Visual Studio 2026 generator. The
    # windows-2025 image ships VS 2026 since GitHub's June 2026 migration.
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # The same script and preset developers use; warnings fail the build.
      - name: Build hydra_tests
        run: .\build_cpp.ps1 -Target hydra_tests

      # The slices of tests/shards.txt, side by side.
      - name: Run hydra_tests
        run: ctest --test-dir build-cpp -C Release -j 4 ${{ env.HOSTED_CTEST_FILTER }} --output-on-failure

      - name: Build hydra_uitest
        run: .\build_cpp.ps1 -Target hydra_uitest

      # The GUI tests draw offscreen on the software GPU and never touch sound
      # or the network (docs/agents/ui-testing.md).
      - name: Run hydra_uitest
        run: .\build-cpp\Release\hydra_uitest.exe --all

  # The same tests built with AddressSanitizer, which stops a test at the first
  # memory error (an overrun, a use after free) and prints where it happened.
  # The asan preset runs on the Windows heap instead of mimalloc; the build
  # never ships. See "The AddressSanitizer build" in docs/development.md.
  # It is slow, so it runs nightly and on a manual run, not on every push (the
  # user's call, 2026-10-10; "Continuous integration" in docs/development.md
  # gives the timing).
  asan:
    name: AddressSanitizer (Windows, Release)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Puts the compiler's folder on PATH for every later step. The ASan
      # runtime DLL lives there, and the exes and the CLI tools that
      # tests/test_cli.cpp starts as child processes all load it.
      - name: Set up the Visual Studio developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build hydra_tests
        run: .\build_cpp.ps1 -Preset asan -Target hydra_tests

      - name: Run hydra_tests
        run: ctest --test-dir build-asan -C Release -j 4 ${{ env.HOSTED_CTEST_FILTER }} --output-on-failure

      - name: Build hydra_uitest
        run: .\build_cpp.ps1 -Preset asan -Target hydra_uitest

      - name: Run hydra_uitest
        run: .\build-asan\Release\hydra_uitest.exe --all

  # A map of which lines of src\ the tests reach. It informs and never blocks
  # (no threshold), so it runs on pushes to main only, not on pull requests.
  # See "The coverage report" in docs/development.md.
  coverage:
    name: Coverage report (Windows, Release)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    # The caps here, the job's and each step's, are set from the proving run's
    # times with room to spare. "Continuous integration" in docs/development.md
    # gives that run and its time.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      COVERAGE_SESSION: hydra_ci
      COVERAGE_OUT: ${{ github.workspace }}\coverage-out
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build hydra_tests and hydra_uitest
        timeout-minutes: 10
        run: |
          .\build_cpp.ps1 -Preset coverage -Target hydra_tests
          .\build_cpp.ps1 -Preset coverage -Target hydra_uitest

      # Puts the tool's path in CC for the later steps. The CLI tests start
      # hydra_batch and hydra_fillcompare as child processes, so those two are
      # instrumented as well.
      - name: Instrument the exes
        timeout-minutes: 3
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -all -products * -property installationPath
          $cc = Get-ChildItem -Recurse -Filter Microsoft.CodeCoverage.Console.exe (Join-Path $vs 'Common7\IDE\Extensions\Microsoft\CodeCoverage.Console') | Select-Object -First 1
          if (-not $cc) { throw "Microsoft.CodeCoverage.Console.exe not found under $vs" }
          "CC=$($cc.FullName)" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:COVERAGE_OUT | Out-Null
          foreach ($exe in 'hydra_tests', 'hydra_batch', 'hydra_fillcompare', 'hydra_uitest') {
            & $cc.FullName instrument "build-coverage\Release\$exe.exe" --session-id $env:COVERAGE_SESSION --settings tools\coverage.settings.xml --nologo
            if ($LASTEXITCODE) { throw "instrument $exe failed" }
          }

      # Each test step runs its command inside "collect", which records every
      # instrumented process the command starts and returns when the command
      # ends, with the command's exit code. No collector outlives its step.
      # The tool's own options go before "--"; everything after it is the
      # command. (A collector started with --server-mode --background hung
      # the first run on main, run 38076842216, until it was cancelled.)
      # The unit-test slices run one at a time here. The GUI runner keeps its
      # own job count (tests/ui/uitest_main.cpp), as in the other jobs.
      - name: Run hydra_tests
        timeout-minutes: 5
        run: >
          & $env:CC collect --session-id $env:COVERAGE_SESSION --settings tools\coverage.settings.xml
          --output "$env:COVERAGE_OUT\hydra_tests.coverage" --nologo --
          ctest --test-dir build-coverage -C Release -j 1 ${{ env.HOSTED_CTEST_FILTER }} --output-on-failure

      - name: Run hydra_uitest
        timeout-minutes: 8
        run: >
          & $env:CC collect --session-id $env:COVERAGE_SESSION --settings tools\coverage.settings.xml
          --output "$env:COVERAGE_OUT\hydra_uitest.coverage" --nologo --
          .\build-coverage\Release\hydra_uitest.exe --all

      - name: Merge and convert to Cobertura
        timeout-minutes: 3
        run: |
          & $env:CC merge "$env:COVERAGE_OUT\hydra_tests.coverage" "$env:COVERAGE_OUT\hydra_uitest.coverage" -f cobertura -o "$env:COVERAGE_OUT\cobertura.xml" --nologo
          if ($LASTEXITCODE) { throw "merge failed" }

      - name: Install ReportGenerator
        timeout-minutes: 3
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path "$env:RUNNER_TEMP\rg"

      - name: Write the HTML report and the summary
        timeout-minutes: 3
        run: |
          & "$env:RUNNER_TEMP\rg\reportgenerator.exe" "-reports:$env:COVERAGE_OUT\cobertura.xml" "-targetdir:$env:COVERAGE_OUT\html" "-sourcedirs:$env:GITHUB_WORKSPACE" "-reporttypes:Html;MarkdownSummaryGithub"
          if ($LASTEXITCODE) { throw "reportgenerator failed" }
          Get-Content "$env:COVERAGE_OUT\html\SummaryGithub.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the HTML report
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-out/html

  # Every input the weekly fuzz run has kept, run once through the parsers with
  # no mutation, so a change that makes a saved input crash, hang or blow up
  # memory fails here instead of waiting for the next fuzz run. The inputs are
  # the combined corpus fuzz.yml's corpus-all job saves, plus testdata/fuzz.
  # tools/fuzz_run.ps1 finds the targets from those folders' names and holds
  # the limits. See "Fuzzing the file parsers" in docs/development.md.
  fuzz-replay:
    name: Fuzz corpus replay (Windows, Release)
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Puts the compiler's folder on PATH. The ASan runtime DLL the fuzz exes
      # load lives there, as in the asan job above.
      - name: Set up the Visual Studio developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build the fuzz exes
        run: .\build_cpp.ps1 -Preset fuzz -Target hydra_fuzz

      # The newest combined corpus. The key itself never matches (no fuzz run
      # has this run's id); the prefix picks the newest save. Caches saved on
      # main are readable from pushes to main and from pull requests into it.
      - name: Restore the grown corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: corpus-all
          key: fuzz-corpus-all-${{ github.run_id }}
          restore-keys: fuzz-corpus-all-

      # No combined corpus yet (before the first fuzz run that saves one, or a
      # pull request that cannot read the cache): replay testdata/fuzz alone.
      - name: Note a missing grown corpus
        if: steps.corpus.outputs.cache-matched-key == ''
        run: |
          $msg = 'No grown fuzz corpus (cache fuzz-corpus-all-*) was found, so only testdata/fuzz is replayed.'
          "::notice title=Fuzz corpus missing::$msg"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $msg

      - name: Replay the saved inputs
        run: .\tools\fuzz_run.ps1 -Mode replay -InputRoot corpus-all, testdata\fuzz -CrashDir crashes

      # The input that broke a parser, as fuzz.yml uploads its findings.
      - name: Upload the crash files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-replay-crashes
          path: crashes
          if-no-files-found: ignore

  tool-tests:
    name: Tool tests (Python and PowerShell)
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      # The full history, so the precheck self-test's two real commit ranges
      # are in the clone; without them it skips that part.
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pytest
        run: py -m pip install pytest

      # Only these two paths: tools\ch_probe\experiments holds scripts that
      # pytest would collect and that drive the real game.
      - name: Run the Python tool tests
        run: py -m pytest tools/ch_probe/tests tools/test_compare_db.py -q

      - name: Run the mutation probe self-test
        run: pwsh -NoProfile -File tools/test_mutation_probe.ps1

      - name: Run the derive-once precheck self-test
        run: pwsh -NoProfile -File tools/test_derive_once_precheck.ps1
